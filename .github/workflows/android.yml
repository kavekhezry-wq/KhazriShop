
name: Build Khazri Shop APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KhazriShop_Android_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q KhazriShop_Android_Starter.zip
          ls -la KhazriShop_Android_Starter

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: KhazriShop_Android_Starter
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhazriShop-APK
          path: KhazriShop_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
